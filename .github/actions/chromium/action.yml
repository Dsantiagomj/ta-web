name: Chromium de Playwright
description: >-
  El Chromium de Playwright con su caché y las dependencias del sistema, para las E2E y
  Lighthouse. Un paso compuesto no admite timeout-minutes: quien la usa pone el tope.
runs:
  using: composite
  steps:
    - name: Versión de Playwright
      id: playwright
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Caché de los navegadores de Playwright
      id: browsers
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # Sin apt si Chromium arranca con lo que trae el runner; con apt, reintentos y un tope.
    - name: Instalar Chromium
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/ci/playwright-chromium.sh

    - name: Instalar las dependencias del sistema de Chromium
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: scripts/ci/playwright-chromium.sh --cached
