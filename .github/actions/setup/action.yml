name: Preparar Node y dependencias
description: pnpm y Node 24 (de .nvmrc) con la caché del store de pnpm, y pnpm install.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0

    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        # Sin esto, setup-node usa el Node 24 que traiga la imagen del runner, que puede
        # ser anterior a engines.node (>=24.22.1, versión de seguridad).
        check-latest: true
        cache: pnpm

    - name: Instalar dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
