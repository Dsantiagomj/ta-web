name: Preparar Node y dependencias
description: pnpm y Node 24 (de .nvmrc) con la caché del store de pnpm, y pnpm install.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0

    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Instalar dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
