name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a un PR cancela la ejecución anterior; en main se ejecutan todas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Valor de prueba: CI no firma sesiones reales.
  PAYLOAD_SECRET: ci-payload-secret-no-es-secreto
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Qué jobs corre este cambio (scripts/ci/ci-scope.ts): solo documentación, solo lo que
  # no entra en el sitio (importadores, hooks, pruebas unitarias) o todo. Un push a main
  # lo corre todo. Pruebas exige justo los jobs que dice `jobs`.
  changes:
    name: Cambios
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      jobs: ${{ steps.scope.outputs.jobs }}
    steps:
      # En un PR, HEAD es el merge del PR sobre su base y HEAD^1 esa base: con dos commits
      # de historia, git diff HEAD^1 HEAD son justo los archivos del PR. --no-renames: un
      # archivo movido sale con su origen y su destino, no solo con el destino.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      # El Node de .nvmrc, no el de la imagen: ci-scope.ts necesita import.meta.main y que
      # Node ejecute TypeScript.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Archivos cambiados y jobs
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            export CI_SCOPE_FULL=1
          elif ! git diff --name-only --no-renames HEAD^1 HEAD > changed.txt; then
            echo "::warning::No se pudo calcular el diff del PR; se corre todo."
            export CI_SCOPE_FULL=1
          fi
          touch changed.txt
          echo "Archivos cambiados:" && cat changed.txt
          node scripts/ci/ci-scope.ts < changed.txt
          if ! grep -q '^jobs=\[' "$GITHUB_OUTPUT"; then
            echo "::error::ci-scope.ts no escribió los jobs."
            exit 1
          fi

  install:
    name: Instalación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

  lint:
    name: Lint y formato
    needs: [changes, install]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'lint')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Tipos
    needs: [changes, install]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'typecheck')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - name: Los tipos de Payload versionados están al día
        run: |
          pnpm generate:types
          git diff --exit-code -- src/payload-types.ts

  unit:
    name: Unitarias
    needs: [changes, install]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'unit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build
    needs: [changes, install]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # El único job que guarda la caché de .next. E2E y Lighthouse compilan con otro entorno
      # y solo la restauran: así no compiten por guardar la misma clave a la vez.
      - uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  integration:
    name: Integración
    needs: [changes, install]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'integration')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ta_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base vacía: el global setup aplica las migraciones con `pnpm migrate` y Payload
      # arranca con getPayload contra ella. Sin push de esquema.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ta_web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:integration

  e2e:
    name: E2E
    needs: [changes, install]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'e2e')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ta_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base vacía: Playwright compila, aplica las migraciones con `pnpm migrate` y
      # arranca `pnpm start`, como en producción. Sin push de esquema.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ta_web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Solo restaura la caché de .next que guarda el job Build (de una ejecución anterior:
      # Build corre a la vez).
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: ./.github/actions/chromium
        timeout-minutes: 20

      - run: pnpm test:e2e

      # La app en modo dev (pública, con noindex), sobre el mismo build.
      - run: pnpm test:e2e:dev-gate
        env:
          E2E_SKIP_BUILD: '1'

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Los presupuestos de DESIGN.md con Lighthouse CI, en paralelo con las E2E y partidos en
  # dos: cada parte mide un trozo de las páginas de lighthouserc.cjs (LHCI_SHARD). Cada una
  # compila en su job, con el entorno de pnpm test:lhci (scripts/lhci-env.ts), sobre la
  # caché de .next que guardó el Build de una ejecución anterior. Con la caché exacta (un PR
  # que no toca src/) el build tarda unos 10 s.
  lighthouse:
    name: Presupuestos (Lighthouse CI) ${{ matrix.part }}/2
    needs: [changes, install]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'lighthouse')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ta_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base vacía: pnpm test:lhci compila, aplica las migraciones, siembra las guías de
      # prueba y arranca `pnpm start`.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ta_web
      LHCI_SHARD: ${{ matrix.part }}/2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Solo restaura la caché de .next que guarda el job Build (de una ejecución anterior:
      # Build corre a la vez).
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: ./.github/actions/chromium
        timeout-minutes: 20

      - run: pnpm test:lhci

      - name: Informes de Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-${{ matrix.part }}
          # Los informes HTML y JSON de cada ejecución y el resultado de las aserciones.
          path: |
            .lighthouseci/reports/
            .lighthouseci/assertion-results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Avisos de seguridad de las dependencias de producción (docs/legacy/security.md). Solo lee
  # pnpm-lock.yaml, así que no instala nada. Un aviso crítico nuevo para todos los PR
  # hasta que se actualice o se acepte; uno alto solo avisa, para no bloquear PR ajenos.
  audit:
    name: Auditoría
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Sin avisos críticos en producción
        run: pnpm audit --prod --audit-level critical

      - name: Avisos altos en producción (solo aviso)
        run: |
          if ! pnpm audit --prod --audit-level high; then
            echo "::warning title=Auditoría::pnpm audit --prod encuentra avisos altos. Revísalos (docs/legacy/security.md)."
          fi

  # Job agregador que exige la protección de main. La revisión con IA (gga) corre en el
  # hook pre-commit de lefthook, no en CI.
  pruebas:
    name: Pruebas
    if: always()
    needs: [changes, install, lint, typecheck, unit, integration, build, e2e, lighthouse, audit]
    runs-on: ubuntu-latest
    steps:
      # Pasa si cada job que pide `changes` pasó y ninguno falló ni se canceló. Un job
      # saltado solo vale si `changes` no lo pedía; si `changes` falla, todo falla.
      - name: Comprobar los jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.changes.outputs.jobs || '[]' }}
          SCOPE: ${{ needs.changes.outputs.scope || 'desconocido' }}
        run: |
          echo "Alcance: $SCOPE"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=0
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != success ]; then
            echo "::error::El job Cambios no pasó."
            failed=1
          fi
          for job in $(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key'); do
            echo "::error::$job no pasó."
            failed=1
          done
          for job in $(echo "$EXPECTED" | jq -r '.[]'); do
            result=$(echo "$NEEDS" | jq -r --arg job "$job" '.[$job].result')
            if [ "$result" != success ]; then
              echo "::error::$job debía correr y quedó en $result."
              failed=1
            fi
          done
          exit "$failed"
