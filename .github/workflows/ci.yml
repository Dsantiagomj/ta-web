name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a un PR cancela la ejecución anterior; en main se ejecutan todas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Valor de prueba: CI no firma sesiones reales.
  PAYLOAD_SECRET: ci-payload-secret-no-es-secreto
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  install:
    name: Instalación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

  lint:
    name: Lint y formato
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Tipos
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - name: Los tipos de Payload versionados están al día
        run: |
          pnpm generate:types
          git diff --exit-code -- src/payload-types.ts

  unit:
    name: Unitarias
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  integration:
    name: Integración
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ta_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base vacía: el global setup aplica las migraciones con `pnpm migrate` y Payload
      # arranca con getPayload contra ella. Sin push de esquema.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ta_web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:integration

  e2e:
    name: E2E
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ta_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base vacía: Playwright compila, aplica las migraciones con `pnpm migrate` y
      # arranca `pnpm start`, como en producción. Sin push de esquema.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ta_web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Caché de los navegadores de Playwright
        id: browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Instalar las dependencias del sistema de Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e

      # La app en modo dev (basic auth y noindex), sobre el mismo build.
      - run: pnpm test:e2e:dev-gate
        env:
          E2E_SKIP_BUILD: '1'

      # Los presupuestos de DESIGN.md con Lighthouse CI, sobre el mismo build, la misma base
      # y el Chromium de Playwright. Va aquí y no en un job propio para no compilar otra vez.
      - name: Presupuestos (Lighthouse CI)
        run: pnpm test:lhci
        env:
          E2E_SKIP_BUILD: '1'

      - name: Informes de Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse
          # Los informes HTML y JSON de cada ejecución y el resultado de las aserciones.
          path: |
            .lighthouseci/reports/
            .lighthouseci/assertion-results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Avisos de seguridad de las dependencias de producción (docs/legacy/security.md). Solo lee
  # pnpm-lock.yaml, así que no instala nada. Un aviso crítico nuevo para todos los PR
  # hasta que se actualice o se acepte; uno alto solo avisa, para no bloquear PR ajenos.
  audit:
    name: Auditoría
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Sin avisos críticos en producción
        run: pnpm audit --prod --audit-level critical

      - name: Avisos altos en producción (solo aviso)
        run: |
          if ! pnpm audit --prod --audit-level high; then
            echo "::warning title=Auditoría::pnpm audit --prod encuentra avisos altos. Revísalos (docs/legacy/security.md)."
          fi

  # Job agregador que exigirá la protección de main. La revisión GGA no entra todavía.
  pruebas:
    name: Pruebas
    if: always()
    needs: [install, lint, typecheck, unit, integration, build, e2e, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar los jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::Algún job no pasó ($result)."
              exit 1
            fi
          done

  # Revisión con IA del PR contra AGENTS.md. Orientativa: no forma parte de Pruebas.
  gga:
    name: Revisión GGA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Dos ejecuciones a la vez refrescarían el mismo token de Codex.
    concurrency:
      group: gga-review
      cancel-in-progress: false
    env:
      CODEX_VERSION: 0.163.0
      GGA_VERSION: v2.10.1
    steps:
      - name: Comprobar el secreto CODEX_AUTH_JSON
        id: secret
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::notice title=Revisión GGA::No hay secreto CODEX_AUTH_JSON (por ejemplo, un PR desde un fork). Se salta la revisión."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.secret.outputs.present == 'true'
        with:
          fetch-depth: 0

      - name: Rama main local para gga --pr-mode
        if: steps.secret.outputs.present == 'true'
        run: git fetch --no-tags origin +refs/heads/main:refs/heads/main

      - uses: actions/setup-node@v7.1.0
        if: steps.secret.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Instalar Codex CLI
        if: steps.secret.outputs.present == 'true'
        run: npm install --global "@openai/codex@${CODEX_VERSION}"

      - name: Credenciales de Codex
        if: steps.secret.outputs.present == 'true'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p "$HOME/.codex"
          chmod 700 "$HOME/.codex"
          ( umask 077 && printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json" )
          chmod 600 "$HOME/.codex/auth.json"

      - name: Instalar Gentleman Guardian Angel
        if: steps.secret.outputs.present == 'true'
        run: |
          git clone --quiet --depth 1 --branch "$GGA_VERSION" \
            https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          chmod +x /tmp/gga/bin/gga
          echo "/tmp/gga/bin" >> "$GITHUB_PATH"

      - name: Revisión
        if: steps.secret.outputs.present == 'true'
        env:
          # Sustituye el PROVIDER="claude" de .gga.
          GGA_PROVIDER: codex
        run: gga run --pr-mode --diff-only

      - name: Borrar las credenciales
        if: always() && steps.secret.outputs.present == 'true'
        run: rm -f "$HOME/.codex/auth.json"
