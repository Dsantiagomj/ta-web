name: Smoke de dev

# Railway despliega main en el entorno dev por su integración con GitHub y publica el
# resultado como un deployment de GitHub ("<proyecto> / dev"). Cuando termina bien, se
# pasa la suite smoke contra la URL del despliegue, con el basic auth de dev.

on:
  deployment_status:

permissions:
  contents: read

# Solo los despliegues correctos de dev comparten grupo: uno nuevo reemplaza al smoke de
# uno anterior. Cualquier otro evento (prod, pendiente, fallido) va a un grupo propio y
# nunca cancela el smoke de un despliegue de dev que sí terminó bien.
concurrency:
  group: >-
    ${{ github.event.deployment_status.state == 'success'
    && contains(github.event.deployment.environment, 'dev')
    && 'smoke-dev' || format('smoke-otro-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  url:
    name: URL del despliegue
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      base_url: ${{ steps.url.outputs.base_url }}
    steps:
      - name: Leer la URL del despliegue
        id: url
        env:
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEV_URL: ${{ vars.DEV_URL }}
        run: |
          # Las credenciales de dev solo viajan a la URL de dev configurada y por HTTPS:
          # cualquier deployment cuyo entorno diga "dev" podría traer otra URL.
          url="${ENVIRONMENT_URL%/}"
          trusted="${DEV_URL%/}"
          if [ -z "$url" ]; then
            # Sin URL no hay smoke: se falla en vez de dar el despliegue por bueno sin probarlo.
            echo "::error title=Smoke de dev::El despliegue de $ENVIRONMENT no trae URL (environment_url vacío), así que el smoke no puede correr. Revisa el dominio del servicio en Railway."
            exit 1
          fi
          if [[ "$trusted" != https://* ]]; then
            echo "::error title=Smoke de dev::Falta la variable de repo DEV_URL (https://…, sin barra final), así que no se envían las credenciales de dev."
            exit 1
          fi
          if [ "$url" != "$trusted" ]; then
            echo "::error title=Smoke de dev::El despliegue de $ENVIRONMENT apunta a $url, que no es DEV_URL ($trusted). No se envían las credenciales."
            exit 1
          fi
          echo "Smoke contra $url ($ENVIRONMENT)."
          echo "base_url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke
    needs: url
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: ${{ needs.url.outputs.base_url }}
    secrets:
      SMOKE_BASIC_AUTH_USER: ${{ secrets.SMOKE_BASIC_AUTH_USER }}
      SMOKE_BASIC_AUTH_PASSWORD: ${{ secrets.SMOKE_BASIC_AUTH_PASSWORD }}
