name: Release

# Despliegue a producción (docs/legacy/infra.md, sección 4). Se lanza a mano desde main con una
# versión semver: comprueba que Pruebas pasó en ese commit, crea la etiqueta vX.Y.Z y su
# release, despliega la etiqueta en Railway con la aprobación del entorno production de
# GitHub y pasa la suite smoke contra producción.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión semver, sin la v (1.2.3)
        required: true
        type: string

permissions: {}

# Dos releases nunca se pisan: la segunda espera a que acabe la primera.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RAILWAY_CLI_VERSION: 5.71.0
  RAILWAY_SERVICE: web
  RAILWAY_ENVIRONMENT: production

jobs:
  release:
    name: Etiqueta y release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      checks: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # GitHub no admite aprobadores obligatorios en ambientes de repos privados (ni con
      # Pro ni con Team): solo el dueño del repo puede lanzar una release a producción.
      - name: Solo el dueño del repo lanza releases
        # actor es quien lanzó la ejecución original y triggering_actor quien la lanzó o
        # la reejecutó: los dos tienen que ser el dueño, o una reejecución lo saltaría.
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Solo $OWNER puede lanzar o reejecutar una release a producción (la lanzó $ACTOR, la ejecuta $TRIGGERING_ACTOR)."
            exit 1
          fi

      - name: Comprobar la rama y la versión
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Release::Los releases salen de main, no de $GITHUB_REF."
            exit 1
          fi
          # La expresión oficial de semver.org (sin ceros a la izquierda en los números,
          # con prerelease y metadatos de build opcionales).
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "::error title=Release::\"$VERSION\" no es una versión semver (1.2.3, 1.2.3-rc.1 o 1.2.3+build.1), sin la v."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # Con sufijo de prerelease (-rc.1…) la release de GitHub se marca como prerelease
          core="${VERSION%%+*}"
          if [[ "$core" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Comprobar que Pruebas pasó en el commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La última ejecución de Pruebas en este commit (una re-ejecución sustituye a
          # la anterior).
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Pruebas&filter=latest" \
            --jq '.check_runs | sort_by(.started_at) | last | if . == null then "ninguna" else (.conclusion // .status) end')
          if [ "$conclusion" != "success" ]; then
            echo "::error title=Release::Pruebas no está en verde en $GITHUB_SHA (resultado: $conclusion)."
            exit 1
          fi
          echo "Pruebas en verde en $GITHUB_SHA."

      - name: Crear la etiqueta y el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          extra=()
          if [ "$PRERELEASE" = true ]; then extra+=(--prerelease); fi
          # Reintentar un release que falló al desplegar reutiliza su etiqueta, pero solo
          # si apunta a este mismo commit: una etiqueta de otro commit nunca se mueve.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error title=Release::La etiqueta $TAG ya existe en otro commit ($tagged). Usa otra versión."
              exit 1
            fi
            echo "La etiqueta $TAG ya apunta a $GITHUB_SHA: se reintenta el mismo release."
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
                --title "$TAG" --generate-notes "${extra[@]}"
            fi
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes "${extra[@]}"

  deploy:
    name: Despliegue a producción
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ambiente production: solo acepta despliegues desde main. La aprobación es el
    # primer paso del job release (solo el dueño del repo lo lanza).
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    permissions:
      contents: read
    outputs:
      prod_url: ${{ steps.config.outputs.prod_url }}
    steps:
      - name: Solo el dueño del repo despliega a producción
        # actor es quien lanzó la ejecución original y triggering_actor quien la lanzó o
        # la reejecutó: los dos tienen que ser el dueño, o una reejecución lo saltaría.
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Solo $OWNER puede lanzar o reejecutar una release a producción (la lanzó $ACTOR, la ejecuta $TRIGGERING_ACTOR)."
            exit 1
          fi

      - name: Comprobar RAILWAY_TOKEN y PROD_URL
        id: config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          missing=0
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error title=Despliegue::Falta el secreto RAILWAY_TOKEN en el entorno production de GitHub (token del proyecto de Railway, entorno production)."
            missing=1
          fi
          url="${PROD_URL%/}"
          case "$url" in
            https://*) ;;
            *)
              echo "::error title=Despliegue::Falta la variable PROD_URL (https://…) en el entorno production de GitHub."
              missing=1
              ;;
          esac
          [ "$missing" = 0 ] || exit 1
          echo "prod_url=$url" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar la CLI de Railway
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      # `railway up` sube el código sin git, así que Railway no inyecta
      # RAILWAY_GIT_COMMIT_SHA: /api/health mostrará este.
      - name: Fijar el commit desplegado
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set "GIT_COMMIT_SHA=$GITHUB_SHA" \
            --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --skip-deploys

      # Sin --detach ni --ci: espera al final del despliegue (pre-deploy con las
      # migraciones y health check) y sale con error si falla.
      - name: Desplegar en Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          railway up --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            --message "$TAG ($GITHUB_SHA)"

      - name: Comprobar que producción sirve este commit
        env:
          PROD_URL: ${{ steps.config.outputs.prod_url }}
        run: |
          for attempt in $(seq 1 30); do
            commit=$(curl --silent --max-time 10 "$PROD_URL/api/health" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Producción sirve $GITHUB_SHA."
              exit 0
            fi
            echo "Intento $attempt: /api/health dice commit '${commit:-ninguno}'; se espera $GITHUB_SHA."
            sleep 10
          done
          echo "::error title=Despliegue::Producción no sirve $GITHUB_SHA tras 5 minutos."
          exit 1

  smoke:
    name: Smoke de producción
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: ${{ needs.deploy.outputs.prod_url }}
